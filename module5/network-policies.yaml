# Database has Egress 
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: database-egress-only-dns
  namespace: ecommerce-dev
spec:
  podSelector:
    matchLabels:
      app: database
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from: 
        - podSelector:
            matchLabels:
              app: backend
      ports: 
        - protocol: TCP
        - port: 5432
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              "kubernetes.io/metadata.name": "kube-system"
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

---
