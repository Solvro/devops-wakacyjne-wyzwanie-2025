apiVersion: v1
kind: Namespace
metadata:
  name: ecommerce-dev
  labels:
    environment: dev
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: rq-ecommerce-dev
  namespace: ecommerce-dev
spec:
  hard:
    pods: "20"
    requests.cpu: "2"
    requests.memory: "10Gi"
    limits.cpu: "20"
    limits.memory: "20Gi"
    persistentvolumeclaims: "10"
---
apiVersion: v1
kind: Namespace
metadata:
  name: ecommerce-prod
  labels:
    environment: prod
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: rq-ecommerce-prod
  namespace: ecommerce-prod
spec:
  hard:
    pods: "30"
    requests.cpu: "10"
    requests.memory: "20Gi"
    limits.cpu: "50"
    limits.memory: "30Gi"
    persistentvolumeclaims: "20"
