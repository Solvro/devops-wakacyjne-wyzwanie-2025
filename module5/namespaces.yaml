apiVersion: v1
kind: Namespace
metadata:
  name: ecommerce-dev
  labels:
    environment: dev
    project: ecommerce
    team: development
  annotations:
    description: "Środowisko deweloperskie dla aplikacji ecommerce"
    contact: "dev-team@ecommerce.com"
    created-by: "devops-team"
---
apiVersion: v1
kind: Namespace
metadata:
  name: ecommerce-prod
  labels:
    environment: prod
    project: ecommerce
    team: production
  annotations:
    description: "Środowisko produkcyjne dla aplikacji ecommerce"
    contact: "devops-team@ecommerce.com"
    created-by: "devops-team"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: ecommerce-dev-quota
  namespace: ecommerce-dev
spec:
  hard:
    # Limity na obiekty
    pods: "20"
    services: "10"
    secrets: "15"
    configmaps: "15"
    persistentvolumeclaims: "8"
    
    # Limity zasobów obliczeniowych
    requests.cpu: "4"
    requests.memory: "8Gi"
    limits.cpu: "8"
    limits.memory: "16Gi"
    
    # Limity przestrzeni dyskowej
    requests.storage: "100Gi"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: ecommerce-dev-limits
  namespace: ecommerce-dev
spec:
  limits:
  - type: Container
    default:
      cpu: "500m"
      memory: "512Mi"
    defaultRequest:
      cpu: "100m"
      memory: "128Mi"
    max:
      cpu: "2000m"
      memory: "2Gi"
    min:
      cpu: "50m"
      memory: "64Mi"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: ecommerce-prod-quota
  namespace: ecommerce-prod
spec:
  hard:
    # Limity na obiekty
    pods: "50"
    services: "20"
    secrets: "25"
    configmaps: "25"
    persistentvolumeclaims: "15"
    
    # Limity zasobów obliczeniowych
    requests.cpu: "10"
    requests.memory: "20Gi"
    limits.cpu: "20"
    limits.memory: "40Gi"
    
    # Limity przestrzeni dyskowej
    requests.storage: "500Gi"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: ecommerce-prod-limits
  namespace: ecommerce-prod
spec:
  limits:
  - type: Container
    default:
      cpu: "1000m"
      memory: "1Gi"
    defaultRequest:
      cpu: "200m"
      memory: "256Mi"
    max:
      cpu: "4000m"
      memory: "4Gi"
    min:
      cpu: "100m"
      memory: "128Mi"