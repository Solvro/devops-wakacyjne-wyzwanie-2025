apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: devops-cluster-admin
  labels:
    rbac-type: devops-admin
rules:
# Pełny dostęp do wszystkich zasobów
- apiGroups: ["*"]
  resources: ["*"]
  verbs: ["*"]
# Pełny dostęp do URL-i nie będących zasobami
- nonResourceURLs: ["*"]
  verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: ecommerce-dev
  name: devops-namespace-admin
  labels:
    rbac-type: devops-namespace
    environment: dev
rules:
# Pełny dostęp do wszystkich zasobów w namespace
- apiGroups: ["*"]
  resources: ["*"]
  verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: ecommerce-prod
  name: devops-namespace-admin
  labels:
    rbac-type: devops-namespace
    environment: prod
rules:
# Pełny dostęp do wszystkich zasobów w namespace
- apiGroups: ["*"]
  resources: ["*"]
  verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: devops-cluster-admin-binding
subjects:
# Użytkownicy DevOps
- kind: User
  name: admin.devops@ecommerce.com
  apiGroup: rbac.authorization.k8s.io
- kind: User
  name: senior.devops@ecommerce.com
  apiGroup: rbac.authorization.k8s.io
# Grupa DevOps
- kind: Group
  name: devops-team
  apiGroup: rbac.authorization.k8s.io
# Konto serwisowe DevOps do automatyzacji
- kind: ServiceAccount
  name: devops-automation-sa
  namespace: kube-system
roleRef:
  kind: ClusterRole
  name: devops-cluster-admin
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: devops-namespace-admin-binding-dev
  namespace: ecommerce-dev
subjects:
# Użytkownicy DevOps
- kind: User
  name: admin.devops@ecommerce.com
  apiGroup: rbac.authorization.k8s.io
- kind: User
  name: senior.devops@ecommerce.com
  apiGroup: rbac.authorization.k8s.io
# Grupa DevOps
- kind: Group
  name: devops-team
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: devops-namespace-admin
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: devops-namespace-admin-binding-prod
  namespace: ecommerce-prod
subjects:
# Użytkownicy DevOps
- kind: User
  name: admin.devops@ecommerce.com
  apiGroup: rbac.authorization.k8s.io
- kind: User
  name: senior.devops@ecommerce.com
  apiGroup: rbac.authorization.k8s.io
# Grupa DevOps
- kind: Group
  name: devops-team
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: devops-namespace-admin
  apiGroup: rbac.authorization.k8s.io