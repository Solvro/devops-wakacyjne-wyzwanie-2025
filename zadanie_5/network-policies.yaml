apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: db-netpol-dev
  namespace: ecommerce-dev
spec:
  podSelector:
    matchLabels:
      app: database
    
  policyTypes:
    - Egress
    - Ingress 
  
  ingress: # only backend can reach the db

    - from:
      - podSelector:
          matchLabels:
            app: backend
          
      ports:
        - protocol: TCP
          port: 5432
  
  egress: # no egresses besides dns

    # allow dns
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53

