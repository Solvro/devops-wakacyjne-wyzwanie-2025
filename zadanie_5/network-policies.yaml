apiVersion: networking.k8s.io/v1
kind: NetworkPolicy 
metadata:
  name: front-netpol-dev
  namespace: ecommerce-dev
spec:
  podSelector:
    matchLabels:
      app: frontend
  
  policyTypes:
    - Egress
  
  egress: # can communicate only with backend pods in it's namespace
    
    - to:
      - podSelector:
          matchLabels:
            app: backend 
      
      ports:
      - protocol: TCP
        port: 8080   
    
    # allow k8s dns
    - to:
        - namespaceSelector: {} 
      ports:
        - protocol: UDP
          port: 53
---
