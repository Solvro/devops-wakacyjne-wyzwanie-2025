apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  # i guess if i have same rules for both envs
  # then i don't have to write it 2 times 
  name: devops-rules 
rules:
  
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["*"]

  - apiGroups: [""]
    resources: ["*"]
    verbs: ["*"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: devops-rules-binding
subjects:

  - kind: Group
    name: devops-team
    apiGroup: rbac.authorization.k8s.io
  
roleRef:
  kind: ClusterRole
  name: devops-rules
  apiGroup: rbac.authorization.k8s.io

