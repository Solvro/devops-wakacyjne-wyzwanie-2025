# Production environment configuration
replicaCount: 3

service:
  type: ClusterIP
  port: 80
  targetPort: 80

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

config:
  DATABASE_URL: "postgresql://postgres:5432/webapp_prod"
  LOG_LEVEL: "WARN"
  CACHE_TTL: "7200"

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 512Mi
