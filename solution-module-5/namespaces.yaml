apiVersion: v1
kind: Namespace
metadata:
  name: ecommerce-dev
  labels:
    environment: dev
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: ecommerce-dev-quota
  namespace: ecommerce-dev
spec:
  hard:
    pods: "10"
    requests.cpu: "4"
    requests.memory: "8Gi"
    persistentvolumeclaims: "5"
---
apiVersion: v1
kind: Namespace
metadata:
  name: ecommerce-prod
  labels:
    environment: prod
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: ecommerce-prod-quota
  namespace: ecommerce-prod
spec:
  hard:
    pods: "50"
    requests.cpu: "20"
    requests.memory: "64Gi"
    persistentvolumeclaims: "20"
